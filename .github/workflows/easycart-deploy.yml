# =============================================================================
# EasyCart — unified deploy pipeline (infrastructure + application)
#
# PRs touching terraform/ or app code  -> build lambda zips, terraform
#                                         validate + networking plan
# Pushes to main                       -> terraform apply all stacks in
#                                         dependency order, then generate
#                                         config.json from outputs, bundle
#                                         the Django app, deploy it to EB
#
# Stack order: networking -> storage -> database -> app -> frontend -> EB app
#
# Required repo secrets:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN
#   (Learner Lab creds rotate — re-paste all three each lab session)
#
# One-time: create the tf state bucket and replace CHANGEME (terraform/backend.hcl)
# =============================================================================

name: easycart-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      include_compute:
        description: "Also deploy usecase/compute (ping-test instances)"
        type: boolean
        default: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_DEFAULT_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  DO_APPLY: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}

concurrency:
  group: easycart-${{ github.ref }}
  cancel-in-progress: false # never kill an apply mid-run

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap remote state bucket (per-account, automatic)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="easycart-tfstate-${ACCOUNT_ID}"
          echo "Using state bucket: $BUCKET"

          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket already exists, reusing."
          else
            echo "Bucket not found, creating..."
            aws s3 mb "s3://$BUCKET" --region us-east-1
            aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
          fi

          cat > terraform/backend.hcl <<EOF
          bucket       = "$BUCKET"
          region       = "us-east-1"
          use_lockfile = true
          EOF

          echo "Wrote terraform/backend.hcl:"
          cat terraform/backend.hcl
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: Bootstrap Terraform state bucket (creates it if missing)
        run: |
          python3 -m pip install --quiet boto3
          python3 scripts/bootstrap_state_bucket.py

      - name: Build Lambda zips (real app code in infra/lambda)
        run: bash scripts/build_lambdas.sh

      # ---------------- Terraform stacks, dependency order ----------------
      - name: networking — init/validate/plan
        working-directory: terraform/usecase/networking
        run: |
          terraform init -input=false -backend-config=../../backend.hcl
          terraform validate
          terraform plan -input=false -out=tfplan
      - name: networking — apply
        if: env.DO_APPLY == 'true'
        working-directory: terraform/usecase/networking
        run: terraform apply -input=false -auto-approve tfplan

      - name: storage — apply
        if: env.DO_APPLY == 'true'
        working-directory: terraform/usecase/storage
        run: |
          terraform init -input=false -backend-config=../../backend.hcl
          terraform validate
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan

      - name: database — apply
        if: env.DO_APPLY == 'true'
        working-directory: terraform/usecase/database
        run: |
          terraform init -input=false -backend-config=../../backend.hcl
          terraform validate
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan

      - name: app — apply
        if: env.DO_APPLY == 'true'
        working-directory: terraform/usecase/app
        run: |
          terraform init -input=false -backend-config=../../backend.hcl
          terraform validate
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan

      - name: frontend — apply
        if: env.DO_APPLY == 'true'
        working-directory: terraform/usecase/frontend
        run: |
          terraform init -input=false -backend-config=../../backend.hcl
          terraform validate
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan

      - name: compute (optional) — ping-test instances
        if: github.event_name == 'workflow_dispatch' && inputs.include_compute
        working-directory: terraform/usecase/compute
        run: |
          terraform init -input=false -backend-config=../../backend.hcl
          terraform apply -input=false -auto-approve

      # On PRs just validate the downstream stacks (their remote-state reads
      # need networking outputs, so plan isn't possible pre-apply).
      - name: PR — validate downstream stacks
        if: env.DO_APPLY != 'true'
        run: |
          for s in storage database app frontend compute; do
            echo "::group::validate $s"
            terraform -chdir="terraform/usecase/$s" init -input=false -backend=false
            terraform -chdir="terraform/usecase/$s" validate
            echo "::endgroup::"
          done

      # ---------------- Application deploy to Elastic Beanstalk ----------------
      - name: Generate infra/config.json from terraform outputs
        if: env.DO_APPLY == 'true'
        run: python3 scripts/generate_config.py

      - name: Seed DynamoDB tables and admin user
        if: env.DO_APPLY == 'true'
        run: |
          python3 -m pip install --quiet boto3 passlib
          echo "Seeding product tables..."
          python3 infra/setup_products.py

          echo "Creating admin user..."
          ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}" \
          ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
          ADMIN_ROLE="SUPER_ADMIN" \
          python3 infra/EasyCartAdminUsers.py

          POOL=$(python3 -c "import json;print(json.load(open('infra/config.json'))['user_pool_id'])")
          if [ -n "${{ secrets.ADMIN_EMAIL }}" ] && [ -n "$POOL" ]; then
            aws cognito-idp admin-create-user --region us-east-1 --user-pool-id "$POOL" \
              --username "${{ secrets.ADMIN_EMAIL }}" --message-action SUPPRESS \
              --user-attributes Name=email,Value="${{ secrets.ADMIN_EMAIL }}" Name=email_verified,Value=true || true
            aws cognito-idp admin-set-user-password --region us-east-1 --user-pool-id "$POOL" \
              --username "${{ secrets.ADMIN_EMAIL }}" --password "${{ secrets.ADMIN_PASSWORD }}" --permanent || true
            aws cognito-idp admin-add-user-to-group --region us-east-1 --user-pool-id "$POOL" \
              --username "${{ secrets.ADMIN_EMAIL }}" --group-name EasyCartAdmins || true
          fi
          echo "Seeding complete."

      - name: Vendor Python wheels (instance has no internet — pip must install offline)
        if: env.DO_APPLY == 'true'
        run: |
          pip download -r requirements.txt -d vendor \
            --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --implementation cp --python-version 311
          # Tell pip on the EB instance to use ONLY the bundled wheels
          printf -- '--no-index\n--find-links vendor/\n' | cat - requirements.txt > requirements.tmp
          mv requirements.tmp requirements.txt
          echo "vendored $(ls vendor | wc -l) wheels"

      - name: Setup Python 3.11 (match the EB platform)
        if: env.DO_APPLY == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The EB instance lives in a VPC with NO internet route, so it cannot
      # reach PyPI. Download every wheel here (the runner has internet) and
      # ship them inside the bundle; requirements.txt is rewritten to install
      # offline from that folder.
      - name: Vendor Python dependencies into the bundle
        if: env.DO_APPLY == 'true'
        run: |
          python -m pip install --upgrade pip
          pip download -r requirements.txt -d wheelhouse
          ls wheelhouse | head
          printf -- '--no-index\n--find-links ./wheelhouse\n%s\n' "$(cat requirements.txt)" > requirements.txt
          head -5 requirements.txt

      - name: Build EB application bundle
        if: env.DO_APPLY == 'true'
        run: |
          zip -qr app.zip . \
            -x "env/*" "terraform/*" ".git/*" ".github/*" \
               "library local/*" "**/__pycache__/*" "*.pyc" \
               "infra/lambda/*.zip" "app.zip"
          unzip -l app.zip | tail -3

      - name: Deploy bundle to Elastic Beanstalk
        if: env.DO_APPLY == 'true'
        run: |
          set -euo pipefail
          BUCKET=$(terraform -chdir=terraform/usecase/storage output -raw bucket_name)
          APP=$(terraform -chdir=terraform/usecase/frontend output -raw eb_application_name)
          ENV=$(terraform -chdir=terraform/usecase/frontend output -raw eb_environment_name)
          LABEL="deploy-${{ github.run_id }}-${{ github.run_attempt }}"
          KEY="eb-bundles/${LABEL}.zip"

          echo "Uploading bundle to s3://${BUCKET}/${KEY}"
          aws s3 cp app.zip "s3://${BUCKET}/${KEY}"

          aws elasticbeanstalk create-application-version \
            --application-name "$APP" \
            --version-label "$LABEL" \
            --source-bundle S3Bucket="$BUCKET",S3Key="$KEY"

          aws elasticbeanstalk update-environment \
            --environment-name "$ENV" \
            --version-label "$LABEL"

          echo "Waiting for environment to become Ready (up to 25 min)..."
          STATUS=""
          for i in $(seq 1 50); do
            STATUS=$(aws elasticbeanstalk describe-environments --environment-names "$ENV" \
              --query 'Environments[0].Status' --output text)
            echo "[$i/50] Status: $STATUS"
            [ "$STATUS" = "Ready" ] && break
            sleep 30
          done
          [ "$STATUS" = "Ready" ] || { echo "Environment never became Ready"; exit 1; }

          VERSION=$(aws elasticbeanstalk describe-environments --environment-names "$ENV" \
            --query 'Environments[0].VersionLabel' --output text)
          echo "Running version: $VERSION"
          [ "$VERSION" = "$LABEL" ] || { echo "Deployed version mismatch — deploy failed on instances"; exit 1; }

          aws elasticbeanstalk describe-environments \
            --environment-names "$ENV" \
            --query 'Environments[0].{Status:Status,Health:Health,Version:VersionLabel}'
